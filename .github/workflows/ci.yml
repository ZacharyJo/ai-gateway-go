name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      # staticcheck 钉死版本：@latest 会让上游新规则随时把 CI 变红。
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Test
        run: go test -race ./...
